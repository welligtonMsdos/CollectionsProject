services:

  collection-api:
    container_name: collection_api
    build:
      context: .
      dockerfile: Collection10Api/Dockerfile
    env_file:
      - Collection10Api/.env
    ports:
      - "5012:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    volumes:
      - ./dataprotection-keys:/home/app/.aspnet/DataProtection-Keys  
    networks:
      - collection-network 

networks:
  collection-network:
    driver: bridge


  